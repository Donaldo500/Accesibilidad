<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="contact_styles.css">
</head>
<body>
    <form class="forms" role="form">
        <div>
            <label for="nombre">Nombre Completo:</label>
            <input name="name" id="nombre" type="text" required aria-label="Ingresa tu nombre completo"/>
        </div>

        <div>
            <label for="correo">Correo:</label>
            <input name="email" id="correo" type="text" required aria-label="Ingresa tu correo electronico"/> 
        </div>

        <button aria-label="Envia tu informacion de contacto" role="button">Enviar</button>
    </form>
</body>
</html>
